<!doctype html><html lang="sr-Latn-RS"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hardver i softver – 5. razred</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#eef4fb;color:#182230}.wrap{max-width:900px;margin:28px auto;padding:0 15px}.hero{background:#17365d;color:#fff;border-radius:18px;padding:27px}.hero h1{margin:0 0 6px}.hero p{margin:0;opacity:.9}.student{display:grid;grid-template-columns:2fr 1fr;gap:12px;background:#fff;padding:18px;border-radius:14px;margin:16px 0}.student input{padding:11px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px;width:100%}.q{background:#fff;padding:19px;border-radius:14px;margin:12px 0;box-shadow:0 3px 12px #0000000b}.q h3{margin:0 0 12px;font-size:18px}.q label{display:block;padding:10px 12px;border:1px solid #dde3ea;border-radius:9px;margin:7px 0;cursor:pointer}.q label:hover{background:#f5f8fc}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}button{border:0;border-radius:22px;padding:12px 20px;font-weight:bold;font-size:15px;cursor:pointer}.finish{background:#2563eb;color:#fff}.restart{background:#dfe6ee;color:#243244}#result{display:none;background:#fff;border-radius:14px;padding:20px;margin:15px 0;font-size:18px}.small{font-size:13px;color:#667085}@media(max-width:600px){.student{grid-template-columns:1fr}}</style></head>
<body><main class="wrap"><section class="hero"><h1>Hardver i softver – 5. razred</h1><p>10 nasumično izabranih pitanja iz baze od 20 pitanja</p></section><div class="student"><input id="studentName" placeholder="Ime i prezime"><input id="studentClass" placeholder="Odeljenje"></div><div id="quiz"></div><div class="actions"><button class="finish" id="finish">Završi kviz</button><button class="restart" id="restart">Pokreni kviz ponovo</button></div><div id="result"></div><p class="small">Pri svakom pokretanju biraju se druga pitanja i menja se redosled ponuđenih odgovora.</p></main>
<script>const bank=[["Šta nazivamo hardverom računarskog sistema?", ["Sve fizičke delove računara", "Sve programe na računaru", "Samo podatke na internetu", "Samo operativni sistem"], 0], ["Čemu prvenstveno služi tastatura?", ["Za prikaz slike", "Za unos teksta, podataka i naredbi", "Za štampanje", "Za hlađenje"], 1], ["Šta se dešava sa kursorom kada pomeramo miš?", ["Pomera se na ekranu", "Monitor se isključuje", "Tastatura se zaključava", "Podaci se brišu"], 0], ["Koja je osnovna uloga monitora?", ["Unos teksta", "Čuvanje podataka", "Prikaz podataka i slike", "Hlađenje računara"], 2], ["Gde se kod stonog računara nalaze mnogi delovi koji obrađuju i čuvaju podatke?", ["U mišu", "U kućištu", "U tastaturi", "U monitoru"], 1], ["Kako se naziva deo računara u kome se čuvaju podaci?", ["Kursor", "Memorija", "Projektor", "Taster"], 1], ["Čemu služi ventilator unutar kućišta?", ["Za unos podataka", "Za povezivanje sa internetom", "Za hlađenje računara", "Za prikaz slike"], 2], ["Koji par čine ulazni uređaji?", ["Monitor i zvučnici", "Miš i tastatura", "Projektor i štampač", "Monitor i štampač"], 1], ["Koji od navedenih je izlazni uređaj?", ["Miš", "Tastatura", "Veb-kamera", "Štampač"], 3], ["Zašto su slušalice sa mikrofonom i ulazni i izlazni uređaj?", ["Mikrofon unosi zvuk, a slušalice ga reprodukuju", "Oba samo čuvaju podatke", "Slušalice unose tekst", "Zato što imaju kabl"], 0], ["Šta nazivamo softverom?", ["Fizičke delove računara", "Programe koji omogućavaju rad računara i obavljanje poslova", "Samo uređaje za unos", "Samo datoteke sa slikama"], 1], ["Koji softver omogućava osnovni rad računara i upravlja njegovim resursima?", ["Operativni sistem", "Program za crtanje", "Video-igra", "Program za prezentacije"], 0], ["Koji od navedenih je operativni sistem?", ["Windows", "Word", "Paint", "PowerPoint"], 0], ["Koji od navedenih je operativni sistem otvorenog koda?", ["Linux", "PowerPoint", "Chrome", "Paint"], 0], ["Koji operativni sistem se koristi na mnogim mobilnim telefonima i tabletima?", ["Android", "Word", "Excel", "Photoshop"], 0], ["Kako nazivamo programe koje korisnik koristi za konkretne poslove?", ["Korisnički programi", "Hardver", "Napajanje", "Ulazni uređaji"], 0], ["Šta znači instalirati program?", ["Pripremiti i postaviti program na uređaj tako da može da se koristi", "Obrisati program", "Isključiti računar", "Odštampati program"], 0], ["Kako možemo koristiti neke programe bez instaliranja na svoj računar?", ["Kao onlajn programe preko interneta", "Samo preko štampača", "Samo sa CD-a", "Isključivanjem operativnog sistema"], 0], ["Na šta se odnosi pojam računarstvo u oblaku?", ["Korišćenje udaljenih računarskih resursa i usluga preko interneta", "Rad računara samo kada je oblačno", "Čuvanje podataka samo na CD-u", "Povezivanje monitora i tastature"], 0], ["Šta se često koristi za pristup ličnom nalogu i onlajn uslugama?", ["Korisničko ime i lozinka", "Rezolucija monitora", "USB kabl i miš", "Štampač i skener"], 0]];let chosen=[];function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function build(){chosen=shuffle(bank).slice(0,10);let box=document.getElementById("quiz");box.innerHTML="";chosen.forEach((x,i)=>{let correct=x[1][x[2]],answers=shuffle(x[1]),d=document.createElement("div");d.className="q";d.dataset.correct=encodeURIComponent(correct);d.innerHTML="<h3>"+(i+1)+". "+x[0]+"</h3>"+answers.map(a=>'<label><input type="radio" name="q'+i+'" value="'+encodeURIComponent(a)+'"> '+a+"</label>").join("");box.appendChild(d)});document.getElementById("result").style.display="none"}
function grade(p){return p<30?1:p<45?2:p<65?3:p<85?4:5}
document.getElementById("finish").onclick=()=>{let s=0,u=0;document.querySelectorAll(".q").forEach((d,i)=>{let r=document.querySelector('input[name="q'+i+'"]:checked');if(!r)u++;else if(r.value===d.dataset.correct)s++});if(u){alert("Odgovori na sva pitanja pre završetka kviza.");return}let p=s*10,g=grade(p),n=document.getElementById("studentName").value.trim(),c=document.getElementById("studentClass").value.trim();let r=document.getElementById("result");r.innerHTML="<b>"+(n?n:"Učenik")+(c?" ("+c+")":"")+": "+s+"/10 ("+p+"%) — ocena "+g+"</b>";r.style.display="block";r.scrollIntoView({behavior:"smooth"})};
document.getElementById("restart").onclick=()=>{document.getElementById("studentName").value="";document.getElementById("studentClass").value="";build();scrollTo({top:0,behavior:"smooth"})};build();</script></body></html>
