ем рачунара", "Притиском на монитор", "Искључивањем миша"]}, {"topic": "Подешавање радног окружења", "q": "Које дугме обично затвара прозор?", "a": ["X у горњем углу", "Дугме за умањивање", "Трака за померање", "Икона звучника"]}, {"topic": "Подешавање радног окружења", "q": "Шта ради дугме за минимизовање прозора?", "a": ["Склања прозор са екрана без затварања програма", "Брише програм", "Гаси рачунар", "Мења лозинку"]}, {"topic": "Подешавање радног окружења", "q": "Чему служи опција за јачину звука?", "a": ["За подешавање гласноће", "За промену резолуције", "За брисање датотека", "За покретање штампача"]}, {"topic": "Подешавање радног окружења", "q": "Шта означава резолуција екрана?", "a": ["Број пиксела по ширини и висини слике", "Јачину звучника", "Број тастера на тастатури", "Брзину штампања"]}, {"topic": "Подешавање радног окружења", "q": "Где подешавамо датум и време рачунара?", "a": ["У системским подешавањима датума и времена", "У корпи", "У програму за цртање", "У фасцикли Слике"]}, {"topic": "Подешавање радног окружења", "q": "Чему служи избор језика тастатуре?", "a": ["Да мењамо распоред знакова при куцању", "Да убрзамо интернет", "Да појачамо звук", "Да обришемо иконе"]}, {"topic": "Подешавање радног окружења", "q": "Шта ради команда Restart?", "a": ["Поново покреће рачунар", "Само гаси монитор", "Брише све датотеке", "Отвара нову фасциклу"]}, {"topic": "Подешавање радног окружења", "q": "Шта ради команда Shut down?", "a": ["Искључује рачунар", "Отвара програм", "Увећава прозор", "Мења боју текста"]}, {"topic": "Подешавање радног окружења", "q": "Која опција служи за повезивање на бежичну мрежу?", "a": ["Wi-Fi подешавања", "Подешавања миша", "Подешавања позадине", "Корпа"]}, {"topic": "Подешавање радног окружења", "q": "Шта можемо подесити у поставкама миша?", "a": ["Брзину показивача", "Количину RAM меморије", "Величину SSD-а", "Број USB прикључака"]}, {"topic": "Подешавање радног окружења", "q": "Чему служи опција Display у подешавањима?", "a": ["За п зација података", "q": "Зашто су јасни називи датотека корисни?", "a": ["Олакшавају проналажење и препознавање садржаја", "Повећавају величину монитора", "Мењају оперативни систем", "Убрзавају штампач"]}, {"topic": "Организација података", "q": "Шта је екстензија датотеке?", "a": ["Део назива који често означава тип датотеке", "Име корисника", "Величина екрана", "Дугме миша"]}, {"topic": "Организација података", "q": "Шта је резервна копија (backup)?", "a": ["Додатна копија важних података за случај губитка", "Брисање оригинала", "Промена позадине", "Искључивање звука"]}];
let current=[],done=false;
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function startQuiz(){const counts={'Хардвер и софтвер':7,'Подешавање радног окружења':6,'Организација података':7};current=shuffle(Object.entries(counts).flatMap(([topic,n])=>shuffle(BANK.filter(x=>x.topic===topic)).slice(0,n))).map(x=>({...x,options:shuffle(x.a)}));done=false;document.getElementById('finish').disabled=false;document.getElementById('result').innerHTML='';document.getElementById('quiz').innerHTML=current.map((x,i)=>`<div class="question" id="q${i}"><div class="topic">${escapeHTML(x.topic)}</div><div class="qtitle">${i+1}. ${escapeHTML(x.q)}</div>${x.options.map((opt,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}"> ${escapeHTML(opt)}</label>`).join('')}</div>`).join('');window.scrollTo({top:0,behavior:'smooth'})}
function finishQuiz(){if(done)return;let missing=current.filter((x,i)=>!document.querySelector(`input[name="q${i}"]:checked`)).length;if(missing&&!confirm(`Ниси одговорио/одговорила на ${missing} питања. Желиш ли да завршиш тест?`))return;let score=0;current.forEach((x,i)=>{let checked=document.querySelector(`input[name="q${i}"]:checked`),answer=checked?x.options[Number(checked.value)]:null;if(answer===x.a[0])score++;document.querySelectorAll(`#q${i} .option`).forEach((label,j)=>{if(x.options[j]===x.a[0])label.classList.add('correct');else if(checked&&Number(checked.value)===j)label.classList.add('wrong')});document.querySelectorAll(`#q${i} input`).forEach(e=>e.disabled=true)});let percent=score*5;let grade=percent<30?1:percent<45?2:percent<65?3:percent<85?4:5;let name=document.getElementById('student').value.trim(),cl=document.getElementById('classroom').value.trim();document.getElementById('result').innerHTML=`<hr><div class="result"><strong>Резултат теста</strong><div>${escapeHTML(name||'Ученик')}${cl?' · '+escapeHTML(cl):''}</div>Тачних одговора: <strong>${score} од 20</strong><div>Успешност: <strong>${percent}%</strong></div>Оцена: <span class="grade">${grade}</span><p class="note">Тачни одговори су означени зеленом бојом, а погрешно изабрани црвеном.</p></div>`;document.getElementById('finish').disabled=true;done=true;document.getElementById('result').scrollIntoView({behavior:'smooth',block:'start'})}
startQuiz();
</script></body></html>
