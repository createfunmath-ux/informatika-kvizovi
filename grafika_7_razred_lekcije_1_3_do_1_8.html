<!doctype html><html lang="sr-Cyrl-RS"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Графика – тест за 7. разред</title><style>*{box-sizing:border-box}body{margin:0;background:#eef4fb;color:#172033;font:16px Arial,sans-serif}.wrap{max-width:850px;margin:25px auto;padding:0 15px}.hero{background:#14213d;color:white;border-radius:18px;padding:25px}.hero h1{margin:0 0 10px}.hero p{margin:0;line-height:1.6}.panel{background:white;border-radius:14px;padding:22px;margin-top:16px;box-shadow:0 3px 14px #0001}.fields{display:flex;gap:12px;flex-wrap:wrap}label{display:block;margin-bottom:7px;font-weight:bold}input{padding:12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;max-width:100%}.question{border-top:1px solid #e2e8f0;padding:20px 0}.question h3{font-size:17px;line-height:1.5;margin:0 0 12px}.choice{display:block;padding:12px;margin:7px 0;border:1px solid #dbe3ef;border-radius:10px;cursor:pointer;font-weight:normal}.choice:has(input:checked){border-color:#2563eb;background:#eff6ff}.choice input{margin-right:10px}.actions{display:flex;gap:10px;flex-wrap:wrap}button{border:0;border-radius:10px;padding:13px 20px;background:#2563eb;color:white;font:inherit;font-weight:bold;cursor:pointer}button.secondary{background:#475569}.muted{color:#64748b}.good{color:#166534}.bad{color:#b91c1c}.result{font-size:22px;font-weight:bold}.review{padding:12px;border-left:4px solid #cbd5e1;background:#f8fafc;margin:10px 0;line-height:1.5}.review.wrong{border-left-color:#ef4444}.review.right{border-left-color:#22c55e}.tag{font-size:12px;color:#64748b}#status{margin-top:12px}@media(max-width:600px){.hero{padding:20px}.panel{padding:16px}.fields input{width:100%}}</style></head><body><main class="wrap"><header class="hero"><h1>🎨 Рачунарска графика — 7. разред</h1><p>Лекције 1.3–1.8: растерска и векторска графика, слојеви, дигиталне слике и рад са векторским објектима.</p><p>20 питања • 18 редовних + 2 напредна • 1 бод по питању</p></header><section class="panel"><div class="fields"><div><label for="student">Име и презиме</label><input id="student" placeholder="Унеси име и презиме"></div><div><label for="klass">Одељење</label><input id="klass" placeholder="нпр. VII-2"></div></div><p class="muted">Питања и редослед понуђених одговора мењају се при сваком покушају.</p></section><form id="quiz" class="panel"></form><section class="panel"><div class="actions"><button id="finish" type="button">Заврши тест</button><button id="again" class="secondary" type="button">Нови покушај</button></div><div id="status" aria-live="polite"></div></section></main><script>const BANK=[{"topic": 0, "q": "Шта је основни елемент растерске слике?", "a": ["Пиксел", "Крива", "Слој", "Чвор"], "advanced": false}, {"topic": 0, "q": "Од чега је састављена векторска слика?", "a": ["Од геометријских објеката", "Од мреже пиксела", "Само од фотографија", "Од звучних записа"], "advanced": false}, {"topic": 0, "q": "Која слика обично губи оштрину при великом увећању?", "a": ["Растерска", "Векторска", "SVG цртеж", "Текстуална датотека"], "advanced": false}, {"topic": 0, "q": "Који формат је типично растерски?", "a": ["PNG", "SVG", "CDR", "DWG"], "advanced": false}, {"topic": 0, "q": "Који формат је намењен векторској графици на вебу?", "a": ["SVG", "JPG", "BMP", "GIF"], "advanced": false}, {"topic": 0, "q": "Шта значи компресија без губитака?", "a": ["Подаци се могу обновити без губитка", "Слика се увек претвара у црно-белу", "Слика се не може отворити", "Бришу се сви пиксели"], "advanced": false}, {"topic": 0, "q": "Који формат је чест избор за фотографије?", "a": ["JPEG", "SVG", "TXT", "DWG"], "advanced": false}, {"topic": 0, "q": "Која је предност векторског логотипа?", "a": ["Може се увећавати без губитка оштрине", "Увек има више пиксела", "Не може се мењати боја", "Мора бити фотографија"], "advanced": false}, {"topic": 0, "q": "Шта представља ознака 1920 × 1080 код растерске слике?", "a": ["Ширину и висину у пикселима", "Број слојева", "Број боја у палети", "Величину датотеке у бајтовима"], "advanced": false}, {"topic": 0, "q": "Шта најбоље описује дубину боје?", "a": ["Број могућих боја или нијанси", "Број објеката у слоју", "Дужину слике", "Број датотека"], "advanced": false}, {"topic": 1, "q": "Чему служе слојеви при обради слике?", "a": ["Да се делови слике уређују независно", "Да се слика претвори у звук", "Да се избрише датотека", "Да се повећа број монитора"], "advanced": false}, {"topic": 1, "q": "Шта се дешава када сакријемо слој?", "a": ["Не види се, али његов садржај остаје", "Трајно се брише", "Претвара се у PDF", "Сви слојеви се спајају"], "advanced": false}, {"topic": 1, "q": "Који слој је обично видљив преко другог ако се преклапају?", "a": ["Онај који је више у списку слојева", "Увек најстарији", "Увек највећи", "Онај са краћим називом"], "advanced": false}, {"topic": 1, "q": "Шта омогућава прозирност слоја?", "a": ["Да се виде делови слојева испод", "Да се убрза интернет", "Да се промени формат тастатуре", "Да се слој закључа"], "advanced": false}, {"topic": 1, "q": "Зашто је корисно именовати слојеве?", "a": ["Лакше се препознаје садржај сваког слоја", "Слика постаје векторска", "Сви слојеви се аутоматски бришу", "Фајл постаје видео"], "advanced": false}, {"topic": 1, "q": "Шта спречава закључавање слоја?", "a": ["Случајне измене његовог садржаја", "Приказ слоја", "Чување слике", "Отварање програма"], "advanced": false}, {"topic": 1, "q": "Који поступак чува могућност каснијег независног мењања текста на плакату?", "a": ["Текст поставити на посебан слој", "Спојити све слојеве одмах", "Сачувати само снимак екрана", "Обрисати позадину"], "advanced": false}, {"topic": 1, "q": "Шта значи спојити слојеве?", "a": ["Објединити садржај више слојева", "Повећати резолуцију монитора", "Направити нови фолдер", "Променити боју свих пиксела у белу"], "advanced": false}, {"topic": 2, "q": "Која алатка служи за уклањање непотребних ивица фотографије?", "a": ["Опсецање (Crop)", "Зумирање", "Чување", "Ротирање странице"], "advanced": false}, {"topic": 2, "q": "Шта ради алатка за промену величине слике?", "a": ["Мења димензије слике", "Додаје нови монитор", "Мења лозинку", "Премешта датотеку у корпу"], "advanced": false}, {"topic": 2, "q": "Шта ради алатка за ротирање слике?", "a": ["Окреће слику за одређени угао", "Повећава број слојева", "Мења име датотеке", "Брише све боје"], "advanced": false}, {"topic": 2, "q": "Шта је осветљеност фотографије?", "a": ["Колико је слика светла или тамна", "Колико има датотека", "Број кривих", "Број отворених картица"], "advanced": false}, {"topic": 2, "q": "Чему служи подешавање контраста?", "a": ["Мења разлику између светлих и тамних делова", "Мења величину курсора", "Брише историју прегледача", "Претвара слику у табелу"], "advanced": false}, {"topic": 2, "q": "Која алатка може да уклони ситну неправилност на фотографији?", "a": ["Алатка за ретуширање", "Алатка за табеле", "Алатка за хипервезе", "Алатка за снимање звука"], "advanced": false}, {"topic": 2, "q": "Зашто чувамо оригиналну фотографију пре обраде?", "a": ["Да можемо да се вратимо на почетну верзију", "Да бисмо онемогућили измене", "Да би фотографија постала 3Д", "Да би нестала из фасцикле"], "advanced": false}, {"topic": 2, "q": "Који формат је погодан када је потребна провидна позадина?", "a": ["PNG", "JPEG", "TXT", "MP3"], "advanced": false}, {"topic": 3, "q": "Шта је векторски објекат?", "a": ["Облик описан геометријским подацима", "Појединачни пиксел", "Део аудио-записа", "Интернет адреса"], "advanced": false}, {"topic": 3, "q": "Који програм је намењен изради векторских цртежа?", "a": ["Inkscape", "Калкулатор", "Музички плејер", "Прегледач PDF-а"], "advanced": false}, {"topic": 3, "q": "Шта је испуна (Fill) објекта?", "a": ["Боја или шара унутрашњости", "Назив датотеке", "Дебљина монитора", "Величина курсора"], "advanced": false}, {"topic": 3, "q": "Шта је контура (Stroke) објекта?", "a": ["Линија која оивичава објекат", "Слој испод слике", "Позадински звук", "Скривени фолдер"], "advanced": false}, {"topic": 3, "q": "Који објекат је најпогоднији за цртање правилног круга?", "a": ["Елипса уз одговарајуће подешавање", "Алатка за текст", "Пипета", "Гумица за пикселе"], "advanced": false}, {"topic": 3, "q": "Шта значи дуплирање објекта?", "a": ["Прављење његове копије", "Брисање свих копија", "Претварање у звук", "Промену резолуције екрана"], "advanced": false}, {"topic": 3, "q": "Која је предност груписања више објеката?", "a": ["Могу се померати и мењати као целина", "Постају растерска фотографија", "Сваки се аутоматски брише", "Губе све боје"], "advanced": false}, {"topic": 3, "q": "Шта је платно у програму за векторско цртање?", "a": ["Радна површина за цртеж", "Кабл за штампач", "Врста компресије", "Списак лозинки"], "advanced": false}, {"topic": 4, "q": "Која алатка црта правоугаоник?", "a": ["Алатка за правоугаонике", "Алатка за увоз звука", "Алатка за слање поште", "Алатка за табеле"], "advanced": false}, {"topic": 4, "q": "Чему служе чворови на векторској путањи?", "a": ["За обликовање линија и кривих", "За бројање пиксела", "За мерење брзине интернета", "За штампање текста"], "advanced": false}, {"topic": 4, "q": "Шта је Безијеова крива?", "a": ["Крива којом се управља преко чворова и ручица", "Врста растерског пиксела", "Формат звучног записа", "Датотека за табеле"], "advanced": false}, {"topic": 4, "q": "Шта значи поравнање објеката?", "a": ["Постављање објеката у заједничку линију или однос", "Брисање свих објеката", "Промена формата фотографије", "Искључивање монитора"], "advanced": false}, {"topic": 4, "q": "Шта ради опција за распоређивање објеката на једнаким размацима?", "a": ["Изједначава размак између њих", "Мења им боје насумично", "Претвара их у пикселе", "Закључава датотеку"], "advanced": false}, {"topic": 4, "q": "Како најлакше добити три једнака круга?", "a": ["Нацртати један па га дуплирати два пута", "Цртати три од ока", "Сликати монитор", "Убацити три фотографије"], "advanced": fals
