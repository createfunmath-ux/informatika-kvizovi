<!doctype html><html lang="sr-Latn-RS"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rasterska i vektorska grafika – kviz</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf3fa;color:#1c293c;font-family:Arial,sans-serif}.wrap{max-width:900px;margin:24px auto;padding:0 15px}.hero{padding:25px;background:#18375d;color:white;border-radius:17px}.hero h1{margin:0 0 9px}.hero p{margin:0;line-height:1.5}.student{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin:15px 0;padding:16px;background:white;border-radius:13px}.student input{width:100%;font:inherit;padding:11px;border:1px solid #b9c8d9;border-radius:8px}.question{background:white;padding:19px;border-radius:13px;margin:12px 0;box-shadow:0 2px 10px #0000000a}.question h3{font-size:18px;margin:0 0 12px}.question label{display:flex;gap:10px;align-items:flex-start;border:1px solid #d7e0ec;border-radius:9px;padding:11px;margin:7px 0;cursor:pointer}.question label:hover{background:#f0f6ff}.question input{margin-top:3px;flex-shrink:0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}button{border:0;border-radius:25px;padding:12px 20px;font-size:15px;font-weight:bold;cursor:pointer}.finish{background:#2563eb;color:white}.restart{background:#dce6f1;color:#1c293c}#result{display:none;background:#fff;border-left:5px solid #2563eb;padding:20px;border-radius:10px;margin:14px 0;font-size:19px}.hint{font-size:13px;color:#64748b}@media(max-width:580px){.student{grid-template-columns:1fr}}

.question .illustration {
    display: block;
    width: min(100%, 440px);
    height: auto;
    margin: 0 auto 15px;
    border: 1px solid #d7e0ec;
    border-radius: 12px;
    background: #f8fbff;
}
.question .illustration text {
    font-family: Arial, sans-serif;
}
</style></head><body><main class="wrap"><header class="hero"><h1>Rasterska i vektorska grafika</h1><p>7. razred · 10 pitanja: 6 lakših, 3 srednja i 1 malo teže · Baza od 20 pitanja</p></header><div class="student"><input id="studentName" placeholder="Ime i prezime" aria-label="Ime i prezime"><input id="studentClass" placeholder="Odeljenje" aria-label="Odeljenje"></div><div id="quiz"></div><div class="actions"><button class="finish" id="finish" type="button">Završi kviz</button><button class="restart" id="restart" type="button">Pokreni kviz ponovo</button></div><div id="result" role="status"></div><p class="hint">Pri novom pokretanju ponovo se biraju pitanja i meša redosled odgovora.</p></main><script>
const bank=[{"level": "l", "question": "Šta je osnovni gradivni element rasterske slike?", "options": ["Piksel", "Kriva", "Sloj", "Stranica"], "correct": 0}, {"level": "l", "question": "Kako je predstavljena rasterska slika?", "options": ["Mrežom piksela", "Samo tekstom", "Skupom zvukova", "Isključivo matematičkim formulama za krive"], "correct": 0}, {"level": "l", "question": "Od čega se sastoji vektorska slika?", "options": ["Od geometrijskih objekata", "Isključivo od piksela", "Od audio-zapisa", "Od redova teksta"], "correct": 0}, {"level": "l", "question": "Šta se obično dešava kada mnogo uvećamo rastersku sliku?", "options": ["Postaje manje oštra i pikseli su vidljiviji", "Automatski dobija više detalja", "Pretvara se u zvuk", "Uvek ostaje jednako oštra"], "correct": 0}, {"level": "l", "question": "Koja vrsta grafike se može uvećavati bez gubitka oštrine oblika?", "options": ["Vektorska", "Rasterska", "Samo JPEG", "Samo BMP"], "correct": 0}, {"level": "l", "question": "Koji format se često koristi za fotografije uz kompresiju sa gubicima?", "options": ["JPEG", "SVG", "DWG", "CDR"], "correct": 0}, {"level": "l", "question": "Koji format rasterske slike koristi kompresiju bez gubitaka?", "options": ["PNG", "JPEG", "DWG", "CDR"], "correct": 0}, {"level": "l", "question": "Koji format je namenjen vektorskoj grafici na veb-stranicama?", "options": ["SVG", "JPEG", "BMP", "RAW"], "correct": 0}, {"level": "l", "question": "Šta je kompresija slike?", "options": ["Postupak smanjenja količine podataka potrebnih za čuvanje slike", "Povećavanje monitora", "Promena tastature", "Pretvaranje slike u štampač"], "correct": 0}, {"level": "l", "question": "Koji format podržava jednostavne animacije i paletu do 256 boja?", "options": ["GIF", "RAW", "DWG", "TIFF"], "correct": 0}, {"level": "l", "question": "Koji uređaj najčešće stvara fotografiju kao rastersku sliku?", "options": ["Digitalni fotoaparat", "Tastatura", "Zvučnik", "Mikrofon"], "correct": 0}, {"level": "l", "question": "Šta predstavlja 3D grafika?", "options": ["Prikaz trodimenzionalnih objekata", "Isključivo crno-bele fotografije", "Slike sastavljene samo od slova", "Grafiku bez širine"], "correct": 0}, {"level": "s", "question": "Zašto je vektorska grafika pogodna za logo koji se štampa i na vizitkarti i na bilbordu?", "options": ["Oblici se ponovo iscrtavaju i ostaju oštri pri različitim veličinama", "Uvek ima više piksela od fotografije", "Može se otvoriti samo na telefonu", "Uvek je sačuvana kao JPEG"], "correct": 0}, {"level": "s", "question": "Šta znači kompresija bez gubitaka?", "options": ["Posle raspakivanja mogu se obnoviti izvorni podaci slike", "Neki detalji se trajno odbacuju", "Slika se pretvara u vektorsku", "Datoteka uvek postaje veća"], "correct": 0}, {"level": "s", "question": "Koji izbor je primereniji za fotografiju na veb-stranici kada je važna mala veličina datoteke, a prihvatljiv je izvestan gubitak kvaliteta?", "options": ["JPEG", "BMP bez kompresije", "DWG", "CDR"], "correct": 0}, {"level": "s", "question": "Šta znači da slika ima dimenzije 2048 × 1152 piksela?", "options": ["Široka je 2048, a visoka 1152 piksela", "Ima 2048 boja i 1152 sloja", "Široka je 1152, a visoka 2048 centimetara", "Zauzima tačno 2048 bajtova"], "correct": 0}, {"level": "s", "question": "Kako na internetu možeš suziti pretragu na slike određene veličine?", "options": ["Pomoću filtera za veličinu slike", "Povećavanjem jačine zvuka", "Promenom boje tastature", "Brisanjem istorije pretrage"], "correct": 0}, {"level": "s", "question": "Šta treba proveriti pre korišćenja tuđe slike pronađene na internetu?", "options": ["Prava korišćenja i uslove licence", "Samo da li je slika šarena", "Da li je ime datoteke kratko", "Da li je monitor dovoljno veliki"], "correct": 0}, {"level": "t", "question": "Rasterska slika je široka 1200, a visoka 800 piksela. Koliko ukupno ima piksela?", "options": ["960 000", "2 000", "96 000", "1 200 800"], "correct": 0}, {"level": "t", "question": "Za plakat treba uvećati jednostavan crtež bez gubitka oštrine. Koji izbor je najprikladniji?", "options": ["Sačuvati crtež kao vektorski SVG", "Sačuvati mali rasterski JPEG pa ga višestruko uvećati", "Sačuvati mali rasterski BMP pa ga višestruko uvećati", "Smanjiti rezoluciju rasterskog crteža pre uvećanja"], "correct": 0}];

    4: `<svg viewBox="0 0 440 130" role="img" aria-label="Isti vektorski oblik u dve veličine"><rect width="440" height="130" fill="#f8fbff"/><path d="M75 85 L102 27 L129 85 Z" fill="#38bdf8" stroke="#0369a1" stroke-width="3"/><path d="M234 106 L282 9 L330 106 Z" fill="#38bdf8" stroke="#0369a1" stroke-width="3"/><path d="M151 64 H209 M201 57 L209 64 L201 71" fill="none" stroke="#64748b" stroke-width="3"/><text x="220" y="124" text-anchor="middle" font-size="12" fill="#475569">Glatke ivice pri različitim veličinama</text></svg>`,

const quiz=document.getElementById('quiz'), result=document.getElementById('result'), finish=document.getElementById('finish');
let current=[],submitted=false;
function shuffle(values){const a=[...values];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function start(){current=shuffle([...shuffle(bank.filter(x=>x.level==='l')).slice(0,6),...shuffle(bank.filter(x=>x.level==='s')).slice(0,3),...shuffle(bank.filter(x=>x.level==='t')).slice(0,1)]);quiz.replaceChildren();current.forEach((item,i)=>{const card=document.createElement('section');card.className='question';const illustration=artwork[bank.indexOf(item)];if(illustration){const picture=document.createElement('div');picture.innerHTML=illustration;const svg=picture.firstElementChild;svg.classList.add('illustration');card.append(svg);}const title=document.createElement('h3');title.textContent=(i+1)+'. '+item.question;card.append(title);shuffle(item.options.map((answer,index)=>({answer,index}))).forEach(({answer,index})=>{const label=document.createElement('label'),input=document.createElement('input'),span=document.createElement('span');input.type='radio';input.name='q'+i;input.value=String(index);span.textContent=answer;label.append(input,span);card.append(label);});quiz.append(card);});submitted=false;finish.disabled=false;result.style.display='none';result.textContent='';}
function grade(p){return p<30?1:p<45?2:p<65?3:p<85?4:5;}
finish.addEventListener('click',()=>{if(submitted)return;let score=0,missing=0;current.forEach((item,i)=>{const chosen=quiz.querySelector('input[name="q'+i+'"]:checked');if(!chosen)missing++;else if(Number(chosen.value)===item.correct)score++;});if(missing){alert('Odgovori na svih 10 pitanja pre završetka kviza.');return;}const p=score*10;const name=document.getElementById('studentName').value.trim(),cls=document.getElementById('studentClass').value.trim();result.textContent=(name?name:'Učenik')+(cls?' ('+cls+')':'')+' — rezultat: '+score+'/10 ('+p+'%), ocena: '+grade(p)+'.';result.style.display='block';submitted=true;finish.disabled=true;quiz.querySelectorAll('input').forEach(input=>input.disabled=true);result.scrollIntoView({behavior:'smooth',block:'center'});});
document.getElementById('restart').addEventListener('click',()=>{document.getElementById('studentName').value='';document.getElementById('studentClass').value='';start();window.scrollTo({top:0,behavior:'smooth'});});start();
</script></body></html>
