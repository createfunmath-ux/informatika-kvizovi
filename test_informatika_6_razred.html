function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){let name=document.getElementById('student').value.trim(),group=document.getElementById('group').value.trim();if(!name||!group){alert('Унеси име, презиме и одељење.');return}locked=false;let pool=[];categories.forEach((cat,i)=>{let count=i<4?3:2;pool.push(...shuffle(BANK.filter(x=>x.cat===cat)).slice(0,count))});pool.push(...shuffle(ADVANCED).slice(0,2));selected=shuffle(pool).map(x=>({...x,options:shuffle(x.answers.map((v,i)=>({v,correct:i===0})))}));document.getElementById('who').textContent=name+' • '+group;let target=document.getElementById('questions');target.replaceChildren();selected.forEach((q,i)=>{let box=document.createElement('div');box.className='q';let title=document.createElement('div');title.className='qtitle';title.textContent=(i+1)+'. '+q.q;box.append(title);let tag=document.createElement('div');tag.className='tag';tag.textContent=q.cat;box.append(tag);q.options.forEach((o,j)=>{let label=document.createElement('label');label.className='choice';let input=document.createElement('input');input.type='radio';input.name='q'+i;input.value=j;label.append(input,document.createTextNode(o.v));box.append(label)});target.append(box)});document.getElementById('intro').classList.add('hidden');document.getElementById('result').classList.add('hidden');document.getElementById('test').classList.remove('hidden');document.getElementById('warning').textContent='';document.getElementById('finish').disabled=false;window.scrollTo(0,0)}
function finish(){if(locked)return;let missing=selected.some((_,i)=>!document.querySelector('input[name="q'+i+'"]:checked'));if(missing){document.getElementById('warning').textContent='Одговори на свих 20 питања пре завршетка.';return}locked=true;let points=0;selected.forEach((q,i)=>{let inputs=[...document.querySelectorAll('input[name="q'+i+'"]')];inputs.forEach((inp,j)=>{let label=inp.parentElement;inp.disabled=true;if(q.options[j].correct)label.classList.add('correct');if(inp.checked&&!q.options[j].correct)label.classList.add('wrong');if(inp.checked&&q.options[j].correct)points++})});let percent=points*5;let grade=percent<30?1:percent<45?2:percent<65?3:percent<85?4:5;document.getElementById('summary').textContent=points+' / 20 тачних ('+percent+'%)';document.getElementById('grade').textContent='Оцена: '+grade;document.getElementById('result').classList.remove('hidden');document.getElementById('finish').disabled=true;document.getElementById('warning').textContent='';document.getElementById('result').scrollIntoView({behavior:'smooth'})}
document.getElementById('start').onclick=start;document.getElementById('finish').onclick=finish;document.getElementById('again').onclick=()=>{document.getElementById('test').classList.add('hidden');document.getElementById('result').classList.add('hidden');document.getElementById('intro').classList.remove('hidden');window.scrollTo(0,0)};
</script></body></html>
